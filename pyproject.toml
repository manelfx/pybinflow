[project]
name = "pybingraph"
version = "0.1.0"
description = "Binary inspection API and UI using angr"
readme = "README.md"
authors = [
    { name = "Manel Fernandez", email = "manel.fernandez@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "angr>=9.2.98",
    "angr-utils>=0.5.0",
    "cxxfilt>=0.3.0",
    "fastapi>=0.111.0",
    "graphviz>=0.20.3",
    "httpx2>=2.4.0",
    "jinja2>=3.1.4",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.1",
    #"streamlit>=1.35.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
]

[project.scripts]
bingraph = "bingraph.api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bingraph"]

[tool.pytest.ini_options]
markers = [
    "slow: integration tests that require playground binaries",
]
