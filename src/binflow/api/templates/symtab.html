<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Symbol Table - {{ filepath }}</title>
    <style>
      body {
        font-family: Helvetica, Arial, sans-serif;
        margin: 24px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
      }
      th {
        background: #f6f6f6;
        text-align: left;
      }
      .demangled {
        display: none;
      }
      .controls {
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <h2>Symbol table</h2>
    <p>File: <strong>{{ filepath }}</strong></p>
    <div class="controls">
      <button onclick="toggleNames()">Toggle mangled/demangled</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Address</th>
          <th>Name</th>
          <th>Origin</th>
          <th>Import</th>
          <th>Export</th>
        </tr>
      </thead>
      <tbody>
        {% for sym in symbols %}
        <tr>
          <td>0x{{ "%x" | format(sym.addr) }}</td>
          <td>
            <a href="/cfg?filepath={{ filepath }}&function=0x{{ "%x" | format(sym.addr) }}">
              <span class="mangled">{{ sym.mangled_name }}</span>
              <span class="demangled">{{ sym.demangled_name }}</span>
            </a>
          </td>
          <td>{{ sym.origin }}</td>
          <td>{{ sym.is_import }}</td>
          <td>{{ sym.is_export }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <script>
      function toggleNames() {
        document.querySelectorAll(".mangled").forEach((el) => {
          el.style.display = el.style.display === "none" ? "inline" : "none";
        });
        document.querySelectorAll(".demangled").forEach((el) => {
          el.style.display = el.style.display === "none" ? "inline" : "none";
        });
      }
    </script>
  </body>
</html>
